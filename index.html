<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Period Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="settings-container">
        <button id="settings-toggle" class="settings-btn" aria-label="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <div id="settings-menu" class="settings-menu hidden">
            <div class="menu-section">
                <h3 class="menu-title">Appearance</h3>
                <div class="mode-toggle">
                    <button id="dark-mode-btn" class="mode-btn active" title="Dark Mode">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    </button>
                    <button id="light-mode-btn" class="mode-btn" title="Light Mode">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    </button>
                </div>
            </div>
            <div class="menu-section">
                <h3 class="menu-title">Color Scheme</h3>
                <div class="theme-options">
                    <button class="theme-opt active" data-theme="default" title="Blue" style="background: #3b82f6;"></button>
                    <button class="theme-opt" data-theme="emerald" title="Emerald" style="background: #10b981;"></button>
                    <button class="theme-opt" data-theme="rose" title="Rose" style="background: #f43f5e;"></button>
                    <button class="theme-opt" data-theme="amber" title="Amber" style="background: #f59e0b;"></button>
                    <button class="theme-opt" data-theme="purple" title="Purple" style="background: #8b5cf6;"></button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="top-bar">
            <div id="greeting" class="greeting-text">Good Morning!</div>
            <div id="current-day-period" class="date-text">Tuesday 10 March</div>
        </div>
        
        <main class="timer-card">
            <div class="circular-container">
                <svg class="progress-ring" viewBox="0 0 400 400">
                    <defs>
                        <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="var(--accent-start)" />
                            <stop offset="100%" stop-color="var(--accent-end)" />
                        </linearGradient>
                        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="8" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    <!-- Background Track -->
                    <circle class="ring-bg" cx="200" cy="200" r="170" />
                    <!-- Progress Path -->
                    <circle id="progress-circle" class="ring-fg" cx="200" cy="200" r="170" />
                </svg>
                
                <div class="timer-inner">
                    <span id="status-label" class="status-badge">CURRENTLY IN</span>
                    <h1 id="period-name" class="period-display">Period 1</h1>
                </div>
            </div>
            
            <footer class="info-grid">
                <div class="info-tile">
                    <span id="next-period-label" class="tile-label">UPCOMING</span>
                    <span id="next-period-name" class="tile-value">Period 2</span>
                </div>
                <div class="info-tile">
                    <span id="countdown-label" class="tile-label">ENDS IN</span>
                    <span id="time-until-next" class="tile-value">12m</span>
                </div>
            </footer>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
